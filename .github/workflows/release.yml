name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (пусто = сегодняшняя дата, YY.M.D)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # Клиент под телефон едет ТЕМ ЖЕ релизом, что и десктопные: у человека один адрес, по
      # которому лежит всё, и версия у них одна. Java и NDK нужны только для него.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Wintun берётся с сайта проекта и проверяется по контрольной сумме.
      #
      # Класть подписанную чужую DLL в свой репозиторий — значит обещать, что она та самая, ничем
      # это обещание не подкрепив. Скачивание с проверкой суммы даёт проверяемую цепочку: сумма
      # написана здесь, в истории, и подмена файла на сайте ломает сборку, а не уезжает молча в
      # релиз.
      - name: Забрать Wintun
        run: |
          set -eu
          curl -fsSL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip

      - name: Собрать и упаковать
        run: |
          set -eu
          VER="${{ inputs.version }}"
          [ -z "$VER" ] && VER=$(date +%y.%-m.%-d)
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p dist

          # Windows: exe + wintun.dll той же разрядности. Без DLL рядом клиент не поднимет
          # устройство вовсе, поэтому она едет в архиве, а не в инструкции «доустановите».
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) wt=wintun/bin/amd64/wintun.dll ;;
              arm64) wt=wintun/bin/arm64/wintun.dll ;;
            esac
            GOOS=windows GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.Version=$VER" -o xsteer.exe ./cmd/xsteer
            cp "$wt" wintun.dll
            gui=""
            # Графический интерфейс: только amd64. Манифест и значок вшиты ресурсом
            # rsrc_windows_amd64.syso, который по имени берётся лишь для amd64; для arm64
            # своего .syso нет, а без манифеста walk не поднимет окно — поэтому там только CLI.
            if [ "$arch" = amd64 ]; then
              GOOS=windows GOARCH=amd64 go build -trimpath \
                -ldflags "-H=windowsgui -s -w -X main.Version=$VER" -o xsteer-gui.exe ./cmd/xsteer-gui
              gui=xsteer-gui.exe
            fi
            zip -j "dist/xsteer-windows-$arch.zip" $gui xsteer.exe wintun.dll wintun/LICENSE.txt
            rm -f xsteer.exe xsteer-gui.exe wintun.dll
          done

          # Linux: клиент и хаб одним файлом, как на роутере.
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.Version=$VER" -o xsteer ./cmd/xsteer
            tar -czf "dist/xsteer-linux-$arch.tar.gz" xsteer
            rm -f xsteer
          done

          # Android — в тот же dist, чтобы файл попал и в релиз, и в SHA256SUMS. Собирается
          # ниже отдельными шагами: gomobile и Gradle не укладываются в этот же блок.
          echo "== собранное для десктопов =="
          ls -la dist

      # ---- клиент под телефон --------------------------------------------------
      #
      # ДВЕ ЛОВУШКИ, на которые эта сборка уже наступала (см. android.yml). `sdkmanager` не
      # лежит в PATH у бегунка, а `yes | sdkmanager` под pipefail отказывает даже при удачной
      # установке: `yes` умирает от SIGPIPE с кодом 141.
      - name: Поставить NDK
        run: |
          set -eu
          ndk=27.2.12479018
          if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
            sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)
            [ -n "$sdkmanager" ] || { echo "::error::в образе бегунка нет cmdline-tools"; exit 1; }
            "$sdkmanager" --install "ndk;$ndk" <<< "y" > /dev/null
          fi
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || { echo "::error::NDK $ndk не поставился"; exit 1; }
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ключа проекта нет — .apk подписан отладочным, поверх прежней сборки он не встанет"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xsteer.jks"
          chmod 600 "$RUNNER_TEMP/xsteer.jks"
          echo "XSTEER_KEYSTORE=$RUNNER_TEMP/xsteer.jks" >> "$GITHUB_ENV"

      - name: Собрать .apk
        env:
          XSTEER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XSTEER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          XSTEER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          # Номер сборки — номер прогона: телефон ставит поверх уже стоящего только то, у чего
          # номер ВЫШЕ, а имя версии берётся то же, что у всего релиза.
          export BUILD_NUMBER="${{ github.run_number }}"
          export XSTEER_VERSION="$VER"
          android/build-aar.sh
          cd android
          log="$RUNNER_TEMP/gradle.log"
          if ! ./gradlew --no-daemon assembleRelease > "$log" 2>&1; then
            echo "== ошибки =="; grep -E '^e: |error:|FAILED' "$log" | head -40
            echo "== хвост журнала =="; tail -40 "$log"
            exit 1
          fi
          apk=$(find ui/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo "::error::сборка не дала .apk"; exit 1; }
          cp "$apk" "../dist/xsteer-android-$VER.apk"

      - name: Суммы
        run: |
          set -eu
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VER" dist/* \
            --title "xsteer $VER" \
            --notes "Релиз $VER.

          Архивы для Windows содержат xsteer.exe и wintun.dll — распакуйте оба в одну папку и
          запускайте от администратора. Суммы файлов — в SHA256SUMS.

          Для телефона — xsteer-android-$VER.apk. Страница установки со ссылкой и QR:
          https://xyzmean.github.io/xsteer/"
