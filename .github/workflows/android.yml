# Сборка приложения под Android.
#
# ЧЕМ ЭТО ОТЛИЧАЕТСЯ ОТ iOS. Ничем не отличается только то, что собирает бегунок. Всё остальное
# проще: Android разрешает приложению поднять туннель без особых прав — достаточно объявить
# службу VpnService, и система сама спросит согласие у человека при первом подключении. Ни
# платного участия, ни сертификатов, ни чужих профилей. Готовый .apk ставится как есть.
#
# Собранное лежит в артефактах прогона, а страницу установки собирает и выкладывает отдельное
# описание — .github/workflows/pages.yml. Выкладка у хранилища одна на весь сайт, поэтому и
# выкладывающее описание одно: две сборки, публикующие каждая своё, стирали бы работу друг друга.
#
# ПРО ПОДПИСЬ. Android ставит новую версию поверх прежней только при совпадении ключа, а
# отладочный ключ на чистом бегунке каждый раз новый. Ключ проекта берётся из секретов хранилища
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD);
# без них сборка идёт с отладочным ключом, и страница установки говорит об этом прямо.
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'mobile/**'
      - 'client/**'
      - 'conf/**'
      - 'wire/**'
      - 'noise/**'
      - 'link/**'
      - 'tun/**'
      - 'chello/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'mobile/**'
      - 'tun/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NDK ставится отдельно: в образе бегунка есть SDK, но NDK в нём бывает не той версии,
      # а gomobile без него не соберёт ни одной архитектуры.
      #
      # ДВЕ ЛОВУШКИ, НА КОТОРЫЕ ЭТОТ ШАГ УЖЕ НАСТУПИЛ.
      #
      # 1. `sdkmanager` НЕ ЛЕЖИТ В PATH. Он в $ANDROID_HOME/cmdline-tools/<версия>/bin, и первый
      #    же прогон отказал с «sdkmanager: command not found».
      # 2. `yes | sdkmanager …` отказывает ДАЖЕ ПРИ УДАЧНОЙ УСТАНОВКЕ. Когда sdkmanager
      #    заканчивает, `yes` умирает от SIGPIPE с кодом 141, а pipefail берёт код любой упавшей
      #    части конвейера — то есть его. Согласие поэтому подаётся строкой на ввод.
      #
      # И проверка в конце — не вежливость: без неё «поставил» означало бы «команда вернулась»,
      # а сборка библиотеки падала бы дальше словами про несуществующий каталог.
      - name: Поставить NDK
        run: |
          ndk=27.2.12479018
          if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
            sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)
            [ -n "$sdkmanager" ] || { echo "::error::в образе бегунка нет cmdline-tools"; exit 1; }
            "$sdkmanager" --install "ndk;$ndk" <<< "y" > /dev/null
          fi
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || { echo "::error::NDK $ndk не поставился"; exit 1; }
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      - name: Собрать библиотеку Go в xsteer.aar
        run: android/build-aar.sh

      - name: Проверки моста
        working-directory: mobile
        run: |
          go vet ./...
          go test ./...

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SIGNED=no" >> "$GITHUB_ENV"
            echo "::notice::ключа проекта нет — подпись отладочная, поверх прежней сборки не встанет"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xsteer.jks"
          chmod 600 "$RUNNER_TEMP/xsteer.jks"
          echo "XSTEER_KEYSTORE=$RUNNER_TEMP/xsteer.jks" >> "$GITHUB_ENV"
          echo "SIGNED=yes" >> "$GITHUB_ENV"

      - name: Собрать приложение
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          XSTEER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XSTEER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          XSTEER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle --no-daemon assembleRelease | tail -30

      # Артефакт собирается с ПОСТОЯННЫМИ именами: его забирает описание страницы установки, и
      # искать в нём файл перебором значило бы ломать страницу при первом переименовании у Gradle.
      - name: Сложить собранное
        run: |
          mkdir -p android/build/out
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo "::error::сборка не дала .apk"; exit 1; }
          cp "$apk" android/build/out/xsteer.apk
          # Отметка о подписи едет рядом с файлом: страница обязана сказать человеку, встанет ли
          # эта сборка поверх прежней, а узнать это можно только здесь.
          printf '%s\n' "${SIGNED:-no}" > android/build/out/signed
          ls -la android/build/out

      - name: Сохранить .apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsteer-android
          path: |
            android/build/out/xsteer.apk
            android/build/out/signed
          if-no-files-found: ignore
          retention-days: 30

      - name: Сохранить библиотеку Go
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsteer-aar
          path: android/app/libs/xsteer.aar
          if-no-files-found: ignore
          retention-days: 14
