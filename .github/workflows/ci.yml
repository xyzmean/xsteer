name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build (linux)
        run: go build ./...

      - name: Vet (linux)
        run: go vet ./...

      # Мост под iOS — ОТДЕЛЬНЫЙ модуль Go, и `go test ./...` в корне его не видит: вложенные
      # модули из перебора исключаются. Без этого шага его проверки не гонялись бы вообще, а
      # узнали бы мы об этом на сборке под iOS, то есть на бегунке macOS и минут через двадцать.
      #
      # Почему модуль отдельный (коротко: golang.org/x/mobile требует Go 1.26 и тащит четыре
      # чужие зависимости) — объяснено в mobile/go.mod.
      - name: Build, vet и тесты моста под iOS
        working-directory: mobile
        run: |
          go build ./...
          go vet ./...
          go test ./...

      # Тот же мост под сам ios/arm64: там собираются другие файлы платформенных пакетов
      # (tun_other.go вместо tun_linux.go, raw_other.go вместо raw_linux.go), и разойтись с ними
      # можно на любой правке, которая iOS в виду не имела.
      - name: Vet (ios/arm64)
        working-directory: mobile
        env:
          GOOS: ios
          GOARCH: arm64
          CGO_ENABLED: '1'
        run: go vet ./...

      # Windows и macOS собираются здесь же и намеренно.
      #
      # Половина кода этого проекта платформенная (устройство, маршруты, сырой сокет), и ломается
      # она ровно тогда, когда правят другую половину. Клиент под Windows уже разъезжался с общей
      # частью на смене сигнатуры маршрутов — поймать это на машине разработчика было нечем,
      # потому что он собирал только свою систему.
      - name: Build (windows)
        run: GOOS=windows go build ./...

      - name: Vet (windows)
        run: GOOS=windows go vet ./...

      - name: Build (darwin)
        run: GOOS=darwin go build ./...

      # Гонка проверяется НА КАЖДОМ прогоне, а не «иногда»: горячий путь здесь многопоточный, а
      # самая дорогая ошибка в нём — повтор nonce, то есть полная потеря AEAD. Такая гонка не
      # падает и не шумит, она просто тихо снимает шифрование, и заметить её без детектора
      # нечем.
      - name: Test (race)
        run: go test -race ./...

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано (gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi
