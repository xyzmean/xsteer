# Сборка приложения под iOS на бегунке macOS, потому что Mac есть не у всех.
#
# ЧТО ЭТО РЕШАЕТ. Собрать приложение под iOS можно только Xcode, а Xcode бывает только на
# macOS. Бегунки macOS у GitHub идут с предустановленным Xcode и для ОТКРЫТЫХ хранилищ
# бесплатны — значит своего Mac не нужно ни для сборки, ни для подписи, ни для установки на
# телефон.
#
# ЧЕГО ЭТО НЕ РЕШАЕТ. Тоннелю нужно право packet-tunnel-provider, а оно открывается только
# платному участию в программе разработчика Apple. Без него собрать можно, поставить — нет.
# AltStore этого не обходит: он вообще не умеет запрашивать произвольные права.
#
# ГДЕ ТЕПЕРЬ СТРАНИЦА УСТАНОВКИ. Её собирает и выкладывает .github/workflows/pages.yml — одно
# описание на все платформы, потому что выкладка у хранилища одна и заменяет сайт целиком. Здесь
# сборка только кладёт .ipa в артефакты прогона, а страница забирает его оттуда.
#
# ПРОХОД БЕЗ КЛЮЧЕЙ. Если ключей доступа в хранилище нет, задание всё равно полезно: оно
# собирает библиотеку Go под iOS и проверяет, что проект Xcode цел и код компилируется. Это и
# есть непрерывная проверка — подписывать для неё нечего.
name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'mobile/**'
      - 'client/**'
      - 'conf/**'
      - 'wire/**'
      - 'noise/**'
      - 'link/**'
      - 'tun/**'
      - 'chello/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'none — только проверить сборку; page — экспорт для страницы установки; testflight — отправить в TestFlight'
        required: true
        default: page
        type: choice
        options:
          - none
          - page
          - testflight

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    # pipefail ОБЯЗАТЕЛЕН, и это не вкус. Оболочка по умолчанию здесь `bash -e`, без pipefail:
    # вывод xcodebuild пропускается через `tail`, чтобы в журнале не было двадцати тысяч строк, а
    # код возврата конвейера без pipefail берётся от ПОСЛЕДНЕЙ команды, то есть от tail, то есть
    # всегда нулевой. Первая же сборка с ошибкой компиляции на Swift поэтому отчиталась «успех», и
    # узнали мы об этом, только прочитав журнал глазами.
    defaults:
      run:
        shell: bash -eo pipefail {0}
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'none' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # Xcode выбирается явно. На бегунке их несколько, и «тот, что по умолчанию» меняется
      # без предупреждения вместе с образом — сборка под iOS ломалась бы в день обновления.
      - name: Выбрать Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Собрать библиотеку Go в XCFramework
        run: ios/build-framework.sh

      - name: Собрать проект Xcode
        run: |
          brew install --quiet xcodegen
          cd ios
          # Группа разработчика в проходе без ключей не нужна и мешает: подписи нет вовсе.
          printf 'DEVELOPMENT_TEAM = %s\n' "${{ secrets.IOS_TEAM_ID }}" > Support/local.xcconfig
          xcodegen generate

      # ---- проход без подписи: только проверка, что всё компилируется ----------
      #
      # Собирается под симулятор: там подпись не нужна вовсе, а компилируется тот же код.
      # Расширение тоннеля под симулятором не работает (тоннеля в симуляторе нет), но
      # СОБИРАЕТСЯ — а проверяем мы здесь именно сборку.
      - name: Проверить сборку без подписи
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish || 'none') == 'none' }}
        run: |
          cd ios
          xcodebuild build \
            -project Xsteer.xcodeproj \
            -scheme Xsteer \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tail -40

      # ---- проход с подписью ---------------------------------------------------
      #
      # Подпись автоматическая, ключом доступа к App Store Connect: с ним Xcode сам заводит
      # сертификат и профили, включая право на тоннель и список устройств. Это три значения в
      # хранилище вместо пяти файлов, и профили не надо обновлять руками, когда они истекут.
      - name: Ключ доступа к App Store Connect
        if: ${{ env.PUBLISH != 'none' }}
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "${{ secrets.IOS_TEAM_ID }}" ]; then
            echo "::error::нет ключа доступа: заведите ASC_KEY_P8_BASE64, ASC_KEY_ID, ASC_ISSUER_ID и IOS_TEAM_ID"
            exit 1
          fi
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Архив
        if: ${{ env.PUBLISH != 'none' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd ios
          # Номер сборки — номер прогона. Телефон ставит поверх уже стоящего только то, у чего
          # номер ВЫШЕ: с постоянной единицей вторая установка молча не заменяла бы первую.
          xcodebuild archive \
            -project Xsteer.xcodeproj \
            -scheme Xsteer \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/Xsteer.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tail -60

      - name: Экспорт
        if: ${{ env.PUBLISH != 'none' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cd ios
          if [ "$PUBLISH" = testflight ]; then
            method=app-store-connect
            dest=upload
          else
            # release-testing — это то, что прежде звалось ad-hoc: сборка ставится на устройства,
            # заранее внесённые в список у разработчика, и больше ни на какие.
            method=release-testing
            dest=export
          fi
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>${method}</string>
              <key>destination</key><string>${dest}</string>
              <key>teamID</key><string>${IOS_TEAM_ID}</string>
              <key>signingStyle</key><string>automatic</string>
              <key>uploadSymbols</key><true/>
              <key>stripSwiftSymbols</key><true/>
              <key>compileBitcode</key><false/>
              <!-- Без прореживания: файл выходит крупнее, зато ставится на любое устройство из
                   списка, а не только на то, под чьё железо его прорезали. -->
              <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Xsteer.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -40
          ls -la build/export || true

      - name: Сохранить артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ios/build/export/**
            mobile/build/**
          if-no-files-found: ignore
          retention-days: 14
